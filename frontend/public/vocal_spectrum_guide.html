<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人声声谱图术语指南</title>
<style>
  /* 自带的深色主题，不依赖外部主题变量，直接打开也能看清 */
  :root{
    --bg:#0e1114; --panel:#161a1e; --border:#2a2f36;
    --fg:#e8eaed; --muted:#a8adb5; --accent:#4aa3ff;
    --blue:#4aa3ff; --slope:#ffb74d; --env:#8bc34a; --h1h2:#f06292; --singer:#e040fb;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:16px;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:16px;margin:0 0 2px;}
  .sub{font-size:12px;color:var(--muted);margin:0 0 12px;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;}
  #plot{width:100%;display:block;border-radius:8px;}
  .tabs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .tab{border:1px solid var(--border);background:transparent;color:var(--muted);
       padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .desc{margin-top:12px;font-size:13px;line-height:1.65;color:var(--fg);min-height:60px;}
  .desc b{color:var(--accent);}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .swatch{width:14px;height:3px;border-radius:2px;display:inline-block;}
  .foot{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h1>人声声谱图 · 术语对照</h1>
  <p class="sub">横轴=频率(Hz，对数刻度)，纵轴=能量(dB，越往上越强)。像 FabFilter Pro-Q3 的界面。点按钮切换发声状态，看曲线和 H1−H2 数字怎么变。</p>

  <div class="panel">
    <svg id="plot" viewBox="0 0 900 400" preserveAspectRatio="xMidYMid meet"></svg>

    <div class="tabs" id="tabs">
      <button class="tab active" data-mode="chest">胸声 Chest</button>
      <button class="tab" data-mode="falsetto">假声 Falsetto</button>
      <button class="tab" data-mode="breathy">气声 Breathy</button>
    </div>

    <div class="desc" id="desc"></div>

    <div class="legend">
      <span><i class="swatch" style="background:var(--blue)"></i>谐波峰 H1,H2,H3…</span>
      <span><i class="swatch" style="background:var(--slope)"></i>频谱斜率(整体坡度)</span>
      <span><i class="swatch" style="background:var(--env)"></i>共振峰包络 F1,F2,F3</span>
      <span><i class="swatch" style="background:var(--h1h2)"></i>H1−H2 差值(从实际峰幅值计算)</span>
      <span><i class="swatch" style="background:var(--singer)"></i>歌手共振峰 2.5–3.5k</span>
    </div>

    <div class="foot">
      频段底色=混音/EQ视角听感分区(低切70-80 / 胸腔80-200 / 温暖·鼻200-400 / 存在感2-3.5k / 齿音5-8k / 空气8-15k)。
      H1−H2、频谱斜率、共振峰是"发声机制视角"的量——判断气声/假声/胸声/用力要看它们。
    </div>
  </div>
</div>

<script>
const W=900,H=400;
const M={l:56,r:16,t:22,b:34};           // 左边距加大，放纵轴标签
const xw=W-M.l-M.r, yh=H-M.t-M.b;
const F_MIN=50, F_MAX=16000;
const xf=f=>M.l + xw*(Math.log(f/F_MIN)/Math.log(F_MAX/F_MIN));
// 纵轴幅度范围：+6dB(顶) ~ -66dB(底)；最强峰放中上部(约36%处)
const DB_TOP=6, DB_BOT=-66;
const yamp=a=>M.t + yh*((DB_TOP-a)/(DB_TOP-DB_BOT));

const MODES={
  chest:{
    label:"胸声 Chest（正常中音区男声）", f0:150, slope:1.5,
    formants:[{f:520,a:5,w:0.9},{f:1100,a:6,w:1.1},{f:2700,a:4,w:1.7}],
    noise:0,
    desc:"<b>H1−H2 很小</b>：H2 几乎和 H1 一样强 → 谐波丰富、声带闭合好。<br>频谱斜率<b>缓</b>：高频谐波还有不少能量 → 声音有力、明亮、有穿透力。"
  },
  falsetto:{
    label:"假声 Falsetto（高音区）", f0:330, slope:7,
    formants:[{f:560,a:4,w:0.9},{f:1100,a:5,w:1.1},{f:2800,a:3,w:1.5}],
    noise:0,
    desc:"F0 抬高到330Hz(约E4)，谐波变稀疏。<b>H1−H2 变大</b>：H2 明显弱于 H1 → 高频谐波衰减快。<br>频谱斜率<b>陡</b>：声源变「薄」(声门接触少)，高频能量掉得厉害 → 听感轻、透、假。"
  },
  breathy:{
    label:"气声 Breathy（漏气）", f0:150, slope:11,
    formants:[{f:520,a:4,w:0.9},{f:1100,a:5,w:1.1},{f:2700,a:4,w:1.6}],
    noise:0.5,
    desc:"同一音高(F0=150Hz)下 <b>H1−H2 最大</b>：H1 独大、H2 很弱 → 声带没闭合严、漏气。<br>频谱斜率<b>陡</b>，且<b>5kHz以上出现红色噪声毛刺</b>(呼吸摩擦气声) → 这就是「空气感/10kHz变多」的来源。<br><i>注意：气声和假声都会让 H1−H2 变大、斜率变陡，靠 F0 高低区分——高F0=假声，同F0却大量高频噪声=气声。</i>"
  }
};

// 谐波幅值模型：基准 offset 让 H1 落在中上部，减去 slope 逐级衰减，再加共振峰增强
const OFFSET=-20;
function harmonicAmp(f,f0,slope,formants){
  let a=OFFSET - slope*(f/f0-1);
  for(const fo of formants){ a += fo.a*Math.exp(-Math.pow(Math.log(f/fo.f)/(0.2*fo.w),2)); }
  return a;
}

function draw(modeKey){
  const m=MODES[modeKey];
  let s="";
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#0e1114"/>`;

  // 频段底色分区
  const bands=[
    [50,80,"#0e1a12"], [80,200,"#12200f"], [200,400,"#152208"],
    [400,2000,"#101218"], [2000,3500,"#1c1030"], [5000,8000,"#22101c"], [8000,16000,"#101a24"]
  ];
  for(const [a,b,c] of bands){
    s+=`<rect x="${xf(a)}" y="${M.t}" width="${xf(b)-xf(a)}" height="${yh}" fill="${c}" opacity="0.6"/>`;
  }

  // 纵轴 dB 网格 + 标签
  for(let db=0;db>=-60;db-=20){
    const y=yamp(db);
    s+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="#ffffff" opacity="0.07"/>`;
    s+=`<text x="${M.l-6}" y="${y+3}" fill="#778" font-size="10" text-anchor="end">${db}</text>`;
  }
  s+=`<text transform="rotate(-90 ${M.l-14} ${M.t+yh/2})" x="${M.l-14}" y="${M.t+yh/2}" fill="#99a" font-size="11" text-anchor="middle">幅度 (dB)</text>`;

  // 横轴频率网格 + 标签
  for(let f=50;f<=16000;f*=2){
    const x=xf(f);
    s+=`<line x1="${x}" y1="${M.t}" x2="${x}" y2="${M.t+yh}" stroke="#ffffff" opacity="0.06"/>`;
    const lab=f>=1000?(f/1000)+"k":f;
    s+=`<text x="${x}" y="${M.t+yh+14}" fill="#778" font-size="10" text-anchor="middle">${lab}</text>`;
  }
  s+=`<text x="${M.l+xw/2}" y="${M.t+yh+28}" fill="#99a" font-size="11" text-anchor="middle">频率 (Hz)</text>`;

  // 谐波峰（收集幅度，供 H1/H2 计算）
  const peaks=[];
  for(let k=1;k<=Math.floor(F_MAX/m.f0);k++){
    const f=k*m.f0;
    if(f<55||f>15500)continue;
    const a=harmonicAmp(f,m.f0,m.slope,m.formants);
    peaks.push({f,a});
    const x=xf(f), y=yamp(a);
    s+=`<rect x="${x-1.5}" y="${y}" width="3" height="${M.t+yh-y}" fill="#4aa3ff" opacity="0.9"/>`;
    s+=`<circle cx="${x}" cy="${y}" r="2.4" fill="#4aa3ff"/>`;
  }

  // 频谱斜率（对低频谐波做线性趋势线，只画到 3kHz）
  const pts=peaks.filter(p=>p.f<3000);
  if(pts.length>2){
    const n=pts.length, sx=pts.reduce((s,v)=>s+v.f,0), sy=pts.reduce((s,v)=>s+v.a,0);
    const sxx=pts.reduce((s,v)=>s+v.f*v.f,0), sxy=pts.reduce((s,v,i)=>s+pts[i].f*pts[i].a,0);
    const b=(n*sxy-sx*sy)/(n*sxx-sx*sx), c=(sy-b*sx)/n;
    const x1=xf(60), y1=yamp(b*60+c), x2=xf(3000), y2=yamp(b*3000+c);
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffb74d" stroke-width="2" stroke-dasharray="6 4"/>`;
    const slopeDeg=Math.round(Math.atan2(y1-y2,x2-x1)*180/Math.PI);
    s+=`<text x="${x2-14}" y="${y2-10}" fill="#ffb74d" font-size="11" text-anchor="end">频谱斜率 ${slopeDeg}°(陡)</text>`;
  }

  // 共振峰包络（平滑曲线）
  let env="";
  for(let f=60;f<=15000;f*=1.03){
    const a=harmonicAmp(f,m.f0,m.slope,m.formants);
    env+=`${env?"L":"M"}${xf(f)},${yamp(a)}`;
  }
  s+=`<path d="${env}" fill="none" stroke="#8bc34a" stroke-width="2" opacity="0.85"/>`;

  // F1 F2 F3 标注
  for(const [name,fo] of [["F1",m.formants[0]],["F2",m.formants[1]],["F3",m.formants[2]]]){
    const x=xf(fo.f);
    s+=`<text x="${x}" y="${M.t-8}" fill="#8bc34a" font-size="12" font-weight="700" text-anchor="middle">${name}</text>`;
    s+=`<line x1="${x}" y1="${M.t-4}" x2="${x}" y2="${M.t+yh}" stroke="#8bc34a" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>`;
  }
  // 歌手共振峰区域
  const gx=xf(2500), gx2=xf(3500);
  s+=`<rect x="${gx}" y="${M.t}" width="${gx2-gx}" height="${yh}" fill="#e040fb" opacity="0.12"/>`;
  s+=`<text x="${(gx+gx2)/2}" y="${M.t+16}" fill="#e040fb" font-size="10.5" text-anchor="middle" font-weight="600">歌手共振峰(穿透力)</text>`;

  // H1、H2 标记 + 从实际峰幅值计算 H1-H2
  const h1=peaks.find(p=>Math.abs(p.f-m.f0)<m.f0*0.5);
  const h2=peaks.find(p=>Math.abs(p.f-2*m.f0)<m.f0*0.5);
  if(h1&&h2){
    const diff=h1.a-h2.a;
    const x1=xf(h1.f), y1=yamp(h1.a), x2=xf(h2.f), y2=yamp(h2.a);
    s+=`<circle cx="${x1}" cy="${y1}" r="5" fill="none" stroke="#f06292" stroke-width="2"/>`;
    s+=`<text x="${x1}" y="${y1-9}" fill="#f06292" font-size="13" font-weight="700" text-anchor="middle">H1</text>`;
    s+=`<circle cx="${x2}" cy="${y2}" r="5" fill="none" stroke="#f06292" stroke-width="2"/>`;
    s+=`<text x="${x2}" y="${y2-9}" fill="#f06292" font-size="13" font-weight="700" text-anchor="middle">H2</text>`;
    const ax=x2+20, yTop=y1-4, yBot=y2+4;
    s+=`<line x1="${ax}" y1="${yTop}" x2="${ax}" y2="${yBot}" stroke="#f06292" stroke-width="2" marker-end="url(#arr)"/>`;
    s+=`<text x="${ax}" y="${(yTop+yBot)/2}" fill="#f06292" font-size="12" font-weight="700" text-anchor="start" dx="6">H1−H2=${diff.toFixed(1)} dB</text>`;
  }

  // 气声高频噪声毛刺
  if(m.noise){
    let seed=42; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
    for(let i=0;i<80;i++){
      const f=3500+rnd()*12000, x=xf(f), y=yamp(-30+rnd()*20);
      s+=`<circle cx="${x}" cy="${y}" r="${0.6+rnd()*1.4}" fill="#e57373" opacity="0.5"/>`;
    }
    s+=`<text x="${W-M.r}" y="${M.t+yh-6}" fill="#e57373" font-size="10.5" text-anchor="end">↑ 高频呼吸噪声(空气感)</text>`;
  }

  s=`<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f06292"/></marker></defs>`+s;
  document.getElementById("plot").innerHTML=s;
  document.getElementById("desc").innerHTML=`<b>${m.label}</b><br>`+m.desc;
}

document.getElementById("tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(!t)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); draw(t.dataset.mode);
});

const qs=new URLSearchParams(location.search);
let initMode=qs.get("mode");
if(!["chest","falsetto","breathy"].includes(initMode)) initMode="chest";
draw(initMode);
document.querySelectorAll(".tab").forEach(t=>{
  t.classList.toggle("active", t.dataset.mode===initMode);
});
</script>
</body>
</html>
